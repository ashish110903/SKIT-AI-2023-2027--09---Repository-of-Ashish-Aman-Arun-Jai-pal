
name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Saturday at 11:59 PM IST (18:29 UTC)
    - cron: '29 18 * * 6'

  workflow_dispatch:
    # Allows manual trigger from GitHub Actions

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Step 3: Install dependencies
      - name: Install PDF & Graph Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      # Step 4: Generate weekly PDF report
      - name: Generate Weekly PDF Report
        run: |
          python generate_report.py weekly

      # Step 5: Move PDF and commit to repository
      - name: Move PDF to Weekly Reports Directory & Commit
        shell: bash
        run: |
          mkdir -p weekly_reports

          # Find generated PDF files
          shopt -s nullglob
          files=(*_Weekly_Progress_Report_Form-3_*.pdf)

          # Check whether PDF was generated
          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No weekly PDF report found!"
            exit 1
          fi

          # Move reports
          mv "${files[@]}" weekly_reports/

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage changes
          git add weekly_reports/

          # Commit and push only if changes exist
          if git diff --staged --quiet; then
            echo "No new changes or reports to commit."
          else
            git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
